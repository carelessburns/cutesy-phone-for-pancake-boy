<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keitai</title>

<style>

.phone { 
  background-blend-mode: normal;
  background-clip: unset;
  background-color: #000000;
  background-image: url("https://i.postimg.cc/7LMHgMYX/images.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  border-radius: 20px;
  border-bottom-left-radius: 8px;
  border-bottom-right-radius: 8px;
  box-sizing: content-box;
  font-family: "Arial Black", Gadget, sans-serif;
  font-size: 12px;
  font-weight: 100;
  overflow: hidden;
  text-align: center;
  color: #ffffff;
  display: inline-block;
  height: 386px;
  padding: 20px;
  padding-top: 54px;
  width: 216px;
  outline: 2px inset #ac8e39;
  border: 16px solid #000000;
  border-top: 68px solid #000000;
  border-bottom: 57px solid #000000;
  filter: brightness(1.2) contrast(98%) hue-rotate(2deg) saturate(95%) sepia(2%);
  box-shadow: 0px 0px 0px 2px #000000;
  text-shadow: 1px 1px #000000, -1px -1px #000000;
}

/* INTERNAL SCREEN */
.screen {
  position: relative;
  background:#0f1f0f;
  width:100%;
  height:100%;
  border-radius:10px;
  overflow:hidden;
  color:#33ff66;
  padding:6px;
  box-sizing:border-box;
  font-size:10px;
  text-align:left;
}

/* scratch */
.screen::after{
  content:"";
  position:absolute;
  top:40px;
  left:20px;
  width:140px;
  height:2px;
  background:rgba(255,255,255,0.15);
  transform:rotate(-12deg);
}

/* status bar */
.status{
  display:flex;
  justify-content:space-between;
  font-size:9px;
  margin-bottom:4px;
}

/* list */
.list-item{
  padding:4px;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.icon{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#33ff66;
}

/* keypad */
.keypad{
  margin-top:6px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

button{
  font-size:10px;
}

canvas{
  background:#0f1f0f;
}

</style>
</head>

<body>

<div class="phone">
  <div class="screen">
    <div class="status">
      <span id="battery">100%</span>
    </div>
    <div id="display"></div>
  </div>
</div>

<div class="keypad" id="keypad"></div>

<script src="script.js"></script>

</body>
</html>
